default_settings: null
behaviors:
  MoveToGoal:
    trainer_type: ppo
    hyperparameters:
      batch_size:         1024
      buffer_size:       10240
      learning_rate:     0.0001    
      beta:               0.005  
      epsilon:            0.2
      lambd:              0.95
      num_epoch:          5
      learning_rate_schedule: constant
      beta_schedule:         constant
      epsilon_schedule:      linear
    network_settings:
      normalize:   false
      hidden_units: 128
      num_layers:   2
      memory:       null      
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma:    0.99
        strength: 1.0
    time_horizon:      128
    summary_freq:      50000
    max_steps:         15000000

env_settings:
  base_port: 5005
  num_envs: 1      

checkpoint_settings:
  run_id:      RandomMazeFixedGoal
  results_dir: results

torch_settings:
  device: null

debug: false
